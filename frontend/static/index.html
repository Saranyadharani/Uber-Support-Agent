<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uber Support</title>
<style>
  :root {
    --bg: #ffffff;
    --panel-tint: #fafafa;
    --text: #000000;
    --text-dim: #55565b;
    --border: #000000;
    --hairline: #e2e2e5;
    --accent: #276EF1;
    --accent-dim: #1a4fb3;
    --good: #00A876;
    --bad: #D32F2F;
    --robot-navy: #16234A;
    --robot-blue: #2C7BE5;
    --robot-cyan: #4FD1E8;
    --radius-card: 28px;
    --radius-header: 16px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    overflow: hidden;
  }

  .page {
    height: 100vh;
    width: 100vw;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 32px 24px;
    gap: 20px;
  }

  /* ---------- Header card ---------- */
  .header-card {
    padding: 4px 0 2px;
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 19px;
    font-weight: 800;
    letter-spacing: -0.01em;
    flex-shrink: 0;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--good);
    box-shadow: 0 0 5px var(--good);
  }

  /* ---------- Content row ---------- */
  .content-row {
    flex: 1;
    width: 100%;
    max-width: 1080px;
    display: flex;
    gap: 0;
    min-height: 0;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-card);
    overflow: hidden;
  }

  /* ---------- Robot card ---------- */
  .bot-card {
    width: 300px;
    flex-shrink: 0;
    background: var(--panel-tint);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    position: relative;
    overflow: hidden;
    padding: 24px 8px 24px 24px;
  }

  .bot-avatar-wrap {
    position: relative;
    width: 190px;
    height: 190px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-left: 28px; /* nudge the robot toward the conversation side */
  }

  .bot-glow {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(44,123,229,0.22) 0%, rgba(44,123,229,0) 70%);
    transition: opacity 0.4s ease, transform 0.4s ease;
    opacity: 0.55;
    transform: scale(1);
  }

  .bot-glow.active {
    opacity: 1;
    transform: scale(1.2);
  }

  .bot-avatar {
    width: 170px;
    height: 170px;
    animation: bob 3.4s ease-in-out infinite;
    position: relative;
    z-index: 1;
  }

  @keyframes bob {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-9px); }
  }

  .bot-eye {
    animation: blink 4.4s ease-in-out infinite;
    transform-origin: center;
  }

  @keyframes blink {
    0%, 92%, 100% { transform: scaleY(1); }
    95% { transform: scaleY(0.08); }
  }

  /* floating chat icons around the robot */
  .float-icon {
    position: absolute;
    width: 30px;
    height: 22px;
    border-radius: 7px 7px 7px 2px;
    background: var(--robot-blue);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2px;
    z-index: 2;
    animation: floaty 3.2s ease-in-out infinite;
  }
  .float-icon span {
    width: 3px; height: 3px; border-radius: 50%; background: #fff;
  }
  .fi-1 { top: 6%; right: 8%; animation-delay: 0s; background: var(--robot-navy); }
  .fi-2 { top: 40%; left: 2%; animation-delay: 0.6s; transform: rotate(-8deg); }
  .fi-3 { bottom: 12%; right: 4%; animation-delay: 1.2s; background: var(--robot-cyan); }

  @keyframes floaty {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-7px); }
  }

  .bot-copy {
    text-align: center;
    max-width: 240px;
  }

  .bot-copy p {
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text-dim);
    line-height: 1.5;
  }

  /* ---------- Chat card ---------- */
  .chat-card {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
    background: var(--bg);
  }

  .reasoning-toggle {
    position: absolute;
    top: 16px;
    right: 20px;
    z-index: 3;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg);
    border: 1.5px solid var(--hairline);
    color: var(--text-dim);
    font-size: 12px;
    font-weight: 600;
    padding: 6px 13px;
    border-radius: 20px;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
  }

  .reasoning-toggle:hover { border-color: #999; color: var(--text); }
  .reasoning-toggle.on { border-color: var(--accent); color: var(--accent); background: rgba(39,110,241,0.06); }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 60px 26px 20px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .messages::-webkit-scrollbar { width: 6px; }
  .messages::-webkit-scrollbar-thumb { background: var(--hairline); border-radius: 3px; }

  .row { display: flex; margin: 6px 0; animation: rise 0.25s ease; }
  .row.customer { justify-content: flex-end; }
  .row.bot { justify-content: flex-start; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .bubble {
    max-width: 72%;
    padding: 12px 16px;
    font-size: 14.5px;
    font-weight: 600;
    line-height: 1.48;
  }

  .row.customer .bubble {
    background: var(--accent);
    color: #fff;
    border-radius: 18px 18px 4px 18px;
  }

  .row.bot .bubble {
    background: var(--bg);
    color: var(--text);
    border-radius: 18px 18px 18px 4px;
    border: 1.5px solid var(--hairline);
  }

  .reasoning-strip {
    max-width: 72%;
    margin-top: 6px;
    padding: 10px 14px;
    background: var(--panel-tint);
    border: 1.5px dashed var(--hairline);
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-dim);
    display: none;
    line-height: 1.6;
  }

  .reasoning-strip.show { display: block; }

  .badge {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 800;
    margin-right: 6px;
  }

  .badge.intent { background: #eeeeee; color: #333; border: 1px solid var(--hairline); }
  .badge.escalate { background: rgba(211,47,47,0.10); color: var(--bad); border: 1px solid rgba(211,47,47,0.3); }
  .badge.auto { background: rgba(0,168,118,0.10); color: var(--good); border: 1px solid rgba(0,168,118,0.3); }

  .typing-row { display: flex; }
  .typing-dots {
    display: flex;
    gap: 4px;
    padding: 14px 17px;
    background: var(--bg);
    border: 1.5px solid var(--hairline);
    border-radius: 18px 18px 18px 4px;
  }
  .typing-dots span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-dim);
    animation: typing 1.1s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes typing {
    0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
    30% { opacity: 1; transform: translateY(-3px); }
  }

  .composer {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 22px 20px;
    border-top: 1.5px solid var(--hairline);
    flex-shrink: 0;
  }

  .composer input {
    flex: 1;
    background: var(--bg);
    border: 1.5px solid var(--hairline);
    color: var(--text);
    font-size: 14.5px;
    font-weight: 600;
    padding: 12px 17px;
    border-radius: 24px;
    outline: none;
    transition: border-color 0.2s;
  }

  .composer input:focus { border-color: var(--accent); }
  .composer input::placeholder { color: #9a9a9e; font-weight: 500; }

  .composer button {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    color: #fff;
    font-size: 17px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.2s, transform 0.1s;
  }

  .composer button:hover { background: var(--accent-dim); }
  .composer button:active { transform: scale(0.94); }
  .composer button:disabled { background: #ccc; cursor: not-allowed; }

  /* ---------- Responsive ---------- */
  @media (max-width: 900px) {
    .page { padding: 18px 14px 14px; gap: 14px; }
    .header-card { padding: 10px 24px; font-size: 15px; }
    .content-row { flex-direction: column; gap: 14px; }
    .bot-card {
      width: 100%;
      flex-direction: row;
      padding: 14px;
      gap: 12px;
      justify-content: center;
    }
    .bot-avatar-wrap { width: 60px; height: 60px; }
    .bot-avatar { width: 54px; height: 54px; }
    .float-icon { display: none; }
    .bot-copy { display: none; }
    .chat-card { flex: 1; min-height: 0; }
    .messages { padding: 56px 16px 16px; }
  }
</style>
</head>
<body>

<div class="page">
  <div class="header-card">
    <span class="status-dot"></span>
    <span>Uber Support</span>
  </div>

  <div class="content-row">
    <aside class="bot-card">
      <div class="bot-avatar-wrap">
        <div class="bot-glow" id="botGlow"></div>
        <svg class="bot-avatar" id="botAvatar" viewBox="0 0 200 220" fill="none" xmlns="http://www.w3.org/2000/svg">
          <line x1="70" y1="18" x2="58" y2="2" stroke="var(--robot-navy)" stroke-width="4" stroke-linecap="round"/>
          <circle cx="58" cy="2" r="6" fill="var(--robot-blue)"/>
          <line x1="130" y1="18" x2="142" y2="2" stroke="var(--robot-navy)" stroke-width="4" stroke-linecap="round"/>
          <circle cx="142" cy="2" r="6" fill="var(--robot-blue)"/>

          <rect x="18" y="80" width="20" height="46" rx="10" fill="#ffffff" stroke="var(--robot-navy)" stroke-width="4"/>
          <rect x="162" y="80" width="20" height="46" rx="10" fill="#ffffff" stroke="var(--robot-navy)" stroke-width="4"/>
          <circle cx="28" cy="103" r="5" fill="var(--robot-cyan)"/>
          <circle cx="172" cy="103" r="5" fill="var(--robot-cyan)"/>

          <rect x="40" y="20" width="120" height="110" rx="46" fill="#ffffff" stroke="var(--robot-navy)" stroke-width="4.5"/>

          <g class="bot-eye">
            <circle cx="80" cy="72" r="19" fill="var(--robot-blue)"/>
            <circle cx="78" cy="72" r="19" fill="none" stroke="var(--robot-navy)" stroke-width="3"/>
            <circle cx="85" cy="67" r="6" fill="#ffffff"/>
            <circle cx="124" cy="72" r="19" fill="var(--robot-cyan)"/>
            <circle cx="122" cy="72" r="19" fill="none" stroke="var(--robot-navy)" stroke-width="3"/>
            <circle cx="129" cy="67" r="6" fill="#ffffff"/>
          </g>

          <path d="M84 104 Q100 116 116 104" stroke="var(--robot-navy)" stroke-width="4.5" stroke-linecap="round" fill="none"/>

          <rect x="52" y="128" width="96" height="80" rx="30" fill="#ffffff" stroke="var(--robot-navy)" stroke-width="4.5"/>
          <path d="M62 148 Q100 132 138 148 L138 198 Q100 212 62 198 Z" fill="var(--robot-navy)"/>
          <circle cx="100" cy="172" r="9" fill="var(--robot-cyan)" opacity="0.9"/>

          <rect x="28" y="140" width="18" height="44" rx="9" fill="#ffffff" stroke="var(--robot-navy)" stroke-width="4"/>
          <rect x="154" y="140" width="18" height="44" rx="9" fill="#ffffff" stroke="var(--robot-navy)" stroke-width="4"/>
        </svg>

        <div class="float-icon fi-1"><span></span><span></span><span></span></div>
        <div class="float-icon fi-2"><span></span><span></span><span></span></div>
        <div class="float-icon fi-3"><span></span><span></span><span></span></div>
      </div>
      <div class="bot-copy">
        <p>Ask about a trip, a charge, a lost item, or anything else — I'll help or connect you to someone who can.</p>
      </div>
    </aside>

    <main class="chat-card">
      <button class="reasoning-toggle" id="reasoningToggle">Show agent reasoning</button>

      <div class="messages" id="messages">
        <div class="row bot">
          <div class="bubble">Hi! What can I help you with today?</div>
        </div>
      </div>

      <form class="composer" id="composer">
        <input id="msgInput" type="text" placeholder="Type a message..." autocomplete="off" />
        <button type="submit" id="sendBtn">➤</button>
      </form>
    </main>
  </div>
</div>

<script>
const messagesEl = document.getElementById('messages');
const composer = document.getElementById('composer');
const input = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');
const botGlow = document.getElementById('botGlow');
const reasoningToggle = document.getElementById('reasoningToggle');

let showReasoning = false;
let history = [];

reasoningToggle.addEventListener('click', () => {
  showReasoning = !showReasoning;
  reasoningToggle.classList.toggle('on', showReasoning);
  reasoningToggle.textContent = showReasoning ? 'Hide agent reasoning' : 'Show agent reasoning';
  document.querySelectorAll('.reasoning-strip').forEach(el => el.classList.toggle('show', showReasoning));
});

function scrollToBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addCustomerBubble(text) {
  const row = document.createElement('div');
  row.className = 'row customer';
  row.innerHTML = `<div class="bubble"></div>`;
  row.querySelector('.bubble').textContent = text;
  messagesEl.appendChild(row);
  scrollToBottom();
}

function addTypingIndicator() {
  const row = document.createElement('div');
  row.className = 'row bot typing-row';
  row.id = 'typingRow';
  row.innerHTML = `<div class="typing-dots"><span></span><span></span><span></span></div>`;
  messagesEl.appendChild(row);
  scrollToBottom();
}

function removeTypingIndicator() {
  const el = document.getElementById('typingRow');
  if (el) el.remove();
}

function addBotBubble(data) {
  const row = document.createElement('div');
  row.className = 'row bot';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = data.reply;
  row.appendChild(bubble);
  messagesEl.appendChild(row);

  const strip = document.createElement('div');
  strip.className = 'reasoning-strip' + (showReasoning ? ' show' : '');
  const escBadge = data.escalate
    ? `<span class="badge escalate">Escalated</span>`
    : `<span class="badge auto">Auto-handled</span>`;
  const reasonsText = (data.reasons || []).join(' ');
  const groundedText = (data.grounded_on || []).length
    ? `Grounded on ${data.grounded_on.length} similar past case(s).`
    : `No similar historical case found.`;
  strip.innerHTML = `
    <span class="badge intent">${data.intent}</span>${escBadge}<br>
    ${reasonsText}<br>${groundedText}
  `;
  messagesEl.appendChild(strip);

  scrollToBottom();
}

async function sendMessage(text) {
  addCustomerBubble(text);
  history.push(text);
  input.value = '';
  sendBtn.disabled = true;
  botGlow.classList.add('active');
  addTypingIndicator();

  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, history: history.slice(0, -1) }),
    });
    const data = await resp.json();
    removeTypingIndicator();

    if (data.error) {
      addBotBubble({ reply: "Sorry, something went wrong on my end. Please try again.", intent: "error", escalate: true, reasons: [data.error], grounded_on: [] });
    } else {
      addBotBubble(data);
    }
  } catch (err) {
    removeTypingIndicator();
    addBotBubble({ reply: "Sorry, I couldn't reach the server. Is the backend running?", intent: "error", escalate: true, reasons: [String(err)], grounded_on: [] });
  } finally {
    sendBtn.disabled = false;
    botGlow.classList.remove('active');
    input.focus();
  }
}

composer.addEventListener('submit', (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  sendMessage(text);
});

input.focus();
</script>

</body>
</html>
